name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install tested DSH runtime
        run: npm install --no-save --ignore-scripts --no-package-lock --include=dev @deepseek-ai/dsh-tools@0.1.7-rc.2 @deepseek-ai/dsh-skill@0.1.7-rc.2 @deepseek-ai/dsh-llm@0.1.7-rc.2 @deepseek-ai/dsh-agent-preset@0.1.7-rc.2
      - name: Run tests
        run: npm test
      - name: Read version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # The integrated package needs a YGOPro2 client that is not in the
      # repository; it is built locally with scripts/build-release.mjs and
      # uploaded to the same release.
      - name: Build external package
        run: node scripts/build-release.mjs external
      - name: Write checksum
        run: cd dist && sha256sum "ygo-tools-for-dsh-${VERSION}-external.tgz" > "ygo-tools-for-dsh-${VERSION}-external.tgz.sha256"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          body_path: docs/release-${{ env.VERSION }}.md
          files: |
            dist/ygo-tools-for-dsh-${{ env.VERSION }}-external.tgz
            dist/ygo-tools-for-dsh-${{ env.VERSION }}-external.tgz.sha256
